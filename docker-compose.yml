services:
  postgres:
    image: postgres:17-alpine
    container_name: gys-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gys_crm
      POSTGRES_USER: gys_crm
      POSTGRES_PASSWORD: gys_crm_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gys_crm -d gys_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
